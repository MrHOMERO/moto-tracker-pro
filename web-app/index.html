<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Pro - Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">

    <!-- Modal de Configuración Inicial / Previa -->
    <div id="modal-config" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
        <div class="glass-panel p-6 rounded-3xl max-w-md w-full space-y-5 shadow-2xl">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-bold text-white tracking-wide">Configurar Vehículo</h2>
                <p class="text-xs text-slate-400">Ingresa los datos de tu moto antes de iniciar el rastreo</p>
            </div>

            <form id="vehicle-form" onsubmit="guardarVehiculo(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Marca</label>
                    <input type="text" id="input-marca" required placeholder="Ej. Yamaha, BMW, Ducati" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Modelo</label>
                    <input type="text" id="input-modelo" required placeholder="Ej. MT-09, GS 1250, Panigale" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Matrícula / Patente</label>
                    <input type="text" id="input-matricula" required placeholder="Ej. SABC 1234" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 uppercase focus:outline-none focus:border-emerald-500 transition">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-900/40 transition active:scale-95 cursor-pointer mt-2">
                    Guardar e Iniciar
                </button>
            </form>
        </div>
    </div>

    <!-- Mapa interactivo de fondo -->
    <div id="map"></div>

    <!-- Interfaz de Control Flotante -->
    <div class="relative z-10 flex flex-col justify-between h-screen p-4 md:p-6 pointer-events-none">
        
        <!-- Header superior -->
        <header class="flex justify-between items-center glass-panel p-4 rounded-2xl pointer-events-auto shadow-2xl">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <div>
                    <h1 id="header-vehiculo" class="font-bold tracking-wider text-sm md:text-base text-slate-200">MI MOTO</h1>
                    <p id="header-matricula" class="text-xs text-emerald-400 font-mono">---</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="abrirConfiguracion()" class="bg-slate-800/80 hover:bg-slate-700 p-2 rounded-xl border border-slate-700 text-xs text-slate-300 transition cursor-pointer" title="Configurar Vehículo">
                    ⚙️
                </button>
                <div class="bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
                    <span class="text-slate-400">Batería:</span>
                    <span id="battery-status" class="font-semibold text-emerald-400">85%</span>
                </div>
            </div>
        </header>

        <!-- Panel de Acciones Inferior -->
        <div class="glass-panel p-6 rounded-3xl pointer-events-auto shadow-2xl space-y-4 max-w-md mx-auto w-full mb-2">
            
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-white" id="panel-titulo">Vehículo Protegido</h2>
                    <p class="text-xs text-slate-400">Modo reposo profundo activo (Invisible)</p>
                </div>
                <span class="px-3 py-1 rounded-full text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">En Espera</span>
            </div>

            <!-- Botón Principal de Emergencia -->
            <button onclick="activarModoRobo()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-red-900/40 transition duration-300 transform active:scale-95 flex items-center justify-center space-x-3 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span class="tracking-wide">¡ACTIVAR RASTREO Y CÁMARA!</span>
            </button>

            <!-- Acciones secundarias -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="solicitarFoto()" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700/50 text-slate-200 py-2.5 px-4 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-2 cursor-pointer">
                    <span>📸 Capturar Foto</span>
                </button>
                <button onclick="centrarMapa()" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700/50 text-slate-200 py-2.5 px-4 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-2 cursor-pointer">
                    <span>🎯 Ubicar Moto</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([-32.3214, -58.0756], 15);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        var marker;
        var vehiculoData = JSON.parse(localStorage.getItem('vehiculoData')) || null;

        document.addEventListener('DOMContentLoaded', function() {
            if (vehiculoData) {
                document.getElementById('modal-config').classList.add('hidden');
                actualizarInterfaz();
            }
        });

        function guardarVehiculo(event) {
            event.preventDefault();
            vehiculoData = {
                marca: document.getElementById('input-marca').value,
                modelo: document.getElementById('input-modelo').value,
                matricula: document.getElementById('input-matricula').value.toUpperCase()
            };
            localStorage.setItem('vehiculoData', JSON.stringify(vehiculoData));
            document.getElementById('modal-config').classList.add('hidden');
            actualizarInterfaz();
        }

        function abrirConfiguracion() {
            if (vehiculoData) {
                document.getElementById('input-marca').value = vehiculoData.marca;
                document.getElementById('input-modelo').value = vehiculoData.modelo;
                document.getElementById('input-matricula').value = vehiculoData.matricula;
            }
            document.getElementById('modal-config').classList.remove('hidden');
        }

        function actualizarInterfaz() {
            if (!vehiculoData) return;

            var titulo = vehiculoData.marca + ' ' + vehiculoData.modelo;
            document.getElementById('header-vehiculo').innerText = titulo;
            document.getElementById('header-matricula').innerText = 'MATRÍCULA: ' + vehiculoData.matricula;

            var lat = -32.3214;
            var lng = -58.0756;

            var popupContent = `
                <div class="text-slate-900 p-1 font-sans">
                    <h3 class="font-bold text-base border-b pb-1 mb-1">${titulo}</h3>
                    <p class="text-xs"><strong>Matrícula:</strong> <span class="bg-slate-200 px-1.5 py-0.5 rounded font-mono">${vehiculoData.matricula}</span></p>
                    <p class="text-xs mt-1"><strong>Estado:</strong> <span class="text-emerald-600 font-semibold">Ubicación Segura</span></p>
                    <p class="text-xs"><strong>Batería:</strong> 85%</p>
                </div>
            `;

            if (marker) {
                map.removeLayer(marker);
            }

            marker = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
        }

        function centrarMapa() {
            if (marker) {
                map.setView(marker.getLatLng(), 16);
                marker.openPopup();
            }
        }

        function activarModoRobo() {
            if (!vehiculoData) return;
            if(confirm("¿Confirmas la activación del modo emergencia para " + vehiculoData.marca + " " + vehiculoData.modelo + "?")) {
                alert("¡Señal enviada a la base de datos! Despertando dispositivo bajo el asiento...");
            }
        }

        function solicitarFoto() {
            alert("Solicitud enviada. Recibirás la imagen en segundos.");
        }
    </script>
</body>
</html>
