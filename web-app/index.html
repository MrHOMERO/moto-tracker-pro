<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Pro - Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        #map { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">

    <!-- Modal de Configuración Inicial -->
    <div id="modal-config" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
        <div class="glass-panel p-6 rounded-3xl max-w-md w-full space-y-5 shadow-2xl">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-bold text-white tracking-wide">Configurar Vehículo</h2>
                <p class="text-xs text-slate-400">Ingresa los datos de tu moto antes de iniciar el rastreo</p>
            </div>
            <form id="vehicle-form" onsubmit="guardarVehiculo(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Marca</label>
                    <input type="text" id="input-marca" required placeholder="Ej. Yamaha, BMW" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Modelo</label>
                    <input type="text" id="input-modelo" required placeholder="Ej. MT-09" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Matrícula / Patente</label>
                    <input type="text" id="input-matricula" required placeholder="Ej. SABC 1234" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white uppercase focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition cursor-pointer">
                    Guardar e Iniciar
                </button>
            </form>
        </div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel de Control Flotante -->
    <div class="relative z-10 flex flex-col justify-between h-screen p-4 md:p-6 pointer-events-none">
        <header class="flex justify-between items-center glass-panel p-4 rounded-2xl pointer-events-auto shadow-2xl">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <div>
                    <h1 id="header-vehiculo" class="font-bold text-sm md:text-base text-slate-200">MI MOTO</h1>
                    <p id="header-matricula" class="text-xs text-emerald-400 font-mono">---</p>
                </div>
            </div>
            <button onclick="abrirConfiguracion()" class="bg-slate-800 p-2 rounded-xl text-xs text-slate-300 cursor-pointer">⚙️</button>
        </header>

        <div class="glass-panel p-6 rounded-3xl pointer-events-auto shadow-2xl space-y-4 max-w-md mx-auto w-full mb-2">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-white">Vehículo Protegido</h2>
                    <p class="text-xs text-slate-400">Modo reposo profundo activo</p>
                </div>
                <span class="px-3 py-1 rounded-full text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">En Espera</span>
            </div>

            <button onclick="activarModoRobo()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition flex items-center justify-center space-x-3 cursor-pointer">
                <span>¡ACTIVAR RASTREO Y CÁMARA!</span>
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Configuración oficial de tu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBX3meGbx-DoOVXTYlCTRYI7ekNpGaDdyk",
            authDomain: "moto-tracker-pro-dd232.firebaseapp.com",
            projectId: "moto-tracker-pro-dd232",
            storageBucket: "moto-tracker-pro-dd232.firebasestorage.app",
            messagingSenderId: "456174033037",
            appId: "1:456174033037:web:ee2ae07303e6ba8789aac4",
            measurementId: "G-BPGF7FDQXX"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        var map = L.map('map', {zoomControl: false}).setView([-32.3214, -58.0756], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        var marker;
        var vehiculoData = JSON.parse(localStorage.getItem('vehiculoData')) || null;

        document.addEventListener('DOMContentLoaded', function() {
            if (vehiculoData) {
                document.getElementById('modal-config').classList.add('hidden');
                actualizarInterfaz();
            }
            escucharDispositivo();
        });

        function guardarVehiculo(event) {
            event.preventDefault();
            vehiculoData = {
                marca: document.getElementById('input-marca').value,
                modelo: document.getElementById('input-modelo').value,
                matricula: document.getElementById('input-matricula').value.toUpperCase()
            };
            localStorage.setItem('vehiculoData', JSON.stringify(vehiculoData));
            document.getElementById('modal-config').classList.add('hidden');
            actualizarInterfaz();
        }

        function abrirConfiguracion() {
            if (vehiculoData) {
                document.getElementById('input-marca').value = vehiculoData.marca;
                document.getElementById('input-modelo').value = vehiculoData.modelo;
                document.getElementById('input-matricula').value = vehiculoData.matricula;
            }
            document.getElementById('modal-config').classList.remove('hidden');
        }

        function actualizarInterfaz() {
            if (!vehiculoData) return;
            var titulo = vehiculoData.marca + ' ' + vehiculoData.modelo;
            document.getElementById('header-vehiculo').innerText = titulo;
            document.getElementById('header-matricula').innerText = 'MATRÍCULA: ' + vehiculoData.matricula;
        }

        function activarModoRobo() {
            if (!vehiculoData) { alert("Configura tu vehículo primero."); return; }
            db.collection("tracker").doc("estado").set({
                modoRobo: true,
                timestamp: Date.now()
            }, { merge: true }).then(() => {
                alert("¡Señal de emergencia enviada al dispositivo!");
            });
        }

        function escucharDispositivo() {
            db.collection("tracker").doc("ubicacion").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const lat = data.lat;
                    const lng = data.lng;
                    var titulo = vehiculoData ? (vehiculoData.marca + ' ' + vehiculoData.modelo) : "Mi Moto";
                    var matricula = vehiculoData ? vehiculoData.matricula : "---";

                    var popupContent = `<div class="text-slate-900 p-1 font-sans"><h3 class="font-bold text-base">${titulo}</h3><p class="text-xs">Matrícula: ${matricula}</p><p class="text-xs text-emerald-600 font-semibold">En Movimiento</p></div>`;

                    if (marker) {
                        marker.setLatLng([lat, lng]);
                    } else {
                        marker = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                    }
                    map.setView([lat, lng], 17);
                }
            });
        }
    </script>
</body>
</html>
